<text x="137" y="104" font-size="14" fill="#9ea6ba">by Isaiah Anson</text>
<text x="55" y="182" font-size="46" font-weight="700" letter-spacing="-0.6" fill="#f4f6fb">Asset Management</text>
<text x="57" y="217" font-size="20" fill="#d3d8e6">Who holds every asset, and who approved it.</text>
<rect x="56.5" y="242.5" width="152" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.18"/><text x="132.5" y="259.3" font-size="13" fill="#d3d8e6" text-anchor="middle">Next.js + PostgreSQL</text>
<rect x="217.5" y="242.5" width="169" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.18"/><text x="302" y="259.3" font-size="13" fill="#d3d8e6" text-anchor="middle">Audit log on every write</text>
<rect x="395.5" y="242.5" width="122" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.18"/><text x="456.5" y="259.3" font-size="13" fill="#d3d8e6" text-anchor="middle">Demo data only</text>
<rect x="600" y="42" width="312" height="236" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.13"/>
<text x="618" y="66" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#9ea6ba">NWA-CMP-10482</text>
<rect x="830.5" y="51.5" width="63" height="20" rx="10" fill="#7fa8ff" fill-opacity="0.16" stroke="#7fa8ff" stroke-opacity="0.5"/>
<text x="862" y="65.5" font-size="11.5" font-weight="600" fill="#f4f6fb" text-anchor="middle">available</text>
<path d="M600 80 H912" stroke="#ffffff" stroke-opacity="0.1"/>
<path d="M627 98 V242" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
<g class="in" style="animation-delay:0.50s"><circle cx="627" cy="98" r="5" fill="#12182d" stroke="#7fa8ff" stroke-width="1.8"/><circle cx="627" cy="98" r="2" fill="#7fa8ff"/><text x="646" y="103" font-size="14" fill="#d3d8e6">Issued</text><text x="894" y="103" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#7b8398" text-anchor="end">issue</text></g>
<g class="in" style="animation-delay:0.75s"><circle cx="627" cy="134" r="5" fill="#12182d" stroke="#7fa8ff" stroke-width="1.8"/><circle cx="627" cy="134" r="2" fill="#7fa8ff"/><text x="646" y="139" font-size="14" fill="#d3d8e6">Transfer requested</text><text x="894" y="139" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#7b8398" text-anchor="end">pending</text></g>
