<g class="in" style="animation-delay:1.25s"><circle cx="627" cy="206" r="5" fill="#12182d" stroke="#7fa8ff" stroke-width="1.8"/><circle cx="627" cy="206" r="2" fill="#7fa8ff"/><text x="646" y="211" font-size="14" fill="#d3d8e6">Custody transferred</text><text x="894" y="211" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#7b8398" text-anchor="end">transfer</text></g>
<g class="in" style="animation-delay:1.50s"><circle cx="627" cy="242" r="5" fill="#12182d" stroke="#7fa8ff" stroke-width="1.8"/><circle cx="627" cy="242" r="2" fill="#7fa8ff"/><text x="646" y="247" font-size="14" fill="#d3d8e6">Returned</text><text x="894" y="247" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#7b8398" text-anchor="end">return</text></g>
<g class="chip"><rect x="711" y="270" width="217" height="28" rx="14" fill="#0c1019" stroke="#7fa8ff" stroke-opacity="0.6"/><text x="819.5" y="288.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#7fa8ff" text-anchor="middle">5 changes · 5 audit-log rows</text></g>
</g>
</svg>
