services:
  postgres:
    image: postgres:16-alpine
    container_name: asset-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asset_management}
      POSTGRES_USER: ${POSTGRES_USER:-asset_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asset_management_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: asset-management-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Built from the POSTGRES_* values, not DATABASE_URL: the .env copy of
      # DATABASE_URL points at localhost, which is wrong inside this container.
      DATABASE_URL: postgresql://${POSTGRES_USER:-asset_management}:${POSTGRES_PASSWORD:-asset_management_dev_password}@postgres:5432/${POSTGRES_DB:-asset_management}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      # Required: the container runs in production mode, which has no dev default.
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
